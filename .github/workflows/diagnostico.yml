name: Diagnóstico temporal (APK en vivo)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://peliculas-neon.vercel.app/api/apk/version; echo
          curl -sL -o app.apk https://peliculas-neon.vercel.app/api/apk; ls -l app.apk
          sudo apt-get install -y aapt >/dev/null 2>&1 || true
          aapt dump badging app.apk 2>/dev/null | head -1 || unzip -l app.apk | head -3
