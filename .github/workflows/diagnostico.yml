name: diagnostico
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          S=https://peliculas-neon.vercel.app
          for i in $(seq 1 40); do curl -s $S/ | grep -q '2\.65\.0' && break; sleep 15; done
          for n in "Soda Stereo" "Los Bunkers" "Mon Laferte" "Los Prisioneros" "Pedro Infante" "Bad Bunny" "Queen" "Shakira" "Juan Gabriel" "Los Fabulosos Cadillacs" "Daddy Yankee" "Café Tacvba"; do
            q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$n")
            echo "$n → $(curl -s "$S/api/artist-genres?name=$q")"
          done
