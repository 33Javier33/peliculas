name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  web-audio:
    runs-on: ubuntu-latest
    steps:
      - name: fuentes de audio
        run: |
          set +e
          S=https://peliculas-neon.vercel.app
          for id in dQw4w9WgXcQ kJQP7kiw5Fk; do
            echo "== /api/audio $id"; curl -s -m 20 "$S/api/audio?id=$id" | python3 -c "import json,sys;d=json.load(sys.stdin);c=d.get('candidates',[]);print(len(c),[x['source'] for x in c]);print([x['url'][:90] for x in c[:3]])"
          done
          echo "== /api/stream"; curl -s -m 20 -r 0-1000 -o /dev/null -w "%{http_code}\n" "$S/api/stream?id=dQw4w9WgXcQ"
          echo "== Piped/Invidious desde aquí"
          for u in https://pipedapi.kavin.rocks https://pipedapi.adminforge.de https://api.piped.private.coffee https://pipedapi.r4fo.com https://pipedapi.leptons.xyz https://pipedapi.nosebs.ru; do printf "%s " $u; curl -s -m 8 -o /dev/null -w "%{http_code}\n" "$u/streams/dQw4w9WgXcQ"; done
          for u in https://inv.nadeko.net https://invidious.nerdvpn.de https://invidious.f5.si https://yewtu.be https://inv.tux.pizza https://invidious.privacyredirect.com; do printf "%s " $u; curl -s -m 8 -o /dev/null -w "%{http_code}\n" "$u/api/v1/videos/dQw4w9WgXcQ?local=true"; done
          echo "== listas públicas"; curl -s -m 10 https://piped-instances.kavin.rocks/ | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d),[x['api_url'] for x in d][:20])"
          curl -s -m 10 "https://api.invidious.io/instances.json?sort_by=health" | python3 -c "import json,sys;d=json.load(sys.stdin);print([x[0] for x in d if x[1].get('api')][:20])"
      - name: navegador (pestaña en segundo plano)
        run: |
          npm init -y >/dev/null; npm i playwright@1.48.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright')
          ;(async () => {
            const b = await chromium.launch({ args: ['--autoplay-policy=no-user-gesture-required'] })
            const ctx = await b.newContext({ viewport: { width: 400, height: 860 } })
            const p = await ctx.newPage()
            p.on('pageerror', (e) => console.log('PAGEERROR', e.message.slice(0, 200)))
            p.on('console', (m) => m.type() === 'error' && console.log('CONSOLE', m.text().slice(0, 160)))
            await p.addInitScript(() => {
              sessionStorage.setItem('cpn-splash-seen', '1')
              const t = { id: 'kJQP7kiw5Fk', title: 'Luis Fonsi - Despacito', channelTitle: 'Luis Fonsi', thumbnail: '', publishedAt: '', description: '' }
              if (!localStorage.getItem('carlospn-music-store')) localStorage.setItem('carlospn-music-store', JSON.stringify({ version: 2, state: { albumsSplit: true, saved: [], savedAlbums: [], queue: [t], currentIndex: 0, isVisible: true } }))
            })
            await p.goto('https://peliculas-neon.vercel.app/music'); await p.waitForTimeout(5000)
            await p.locator('[aria-label="Reproducir"], [aria-label="Pausar"]').first().click().catch((e) => console.log('sin boton', e.message.slice(0, 80)))
            const st = () => p.evaluate(() => ({ audios: Array.from(document.querySelectorAll('audio')).map((a) => ({ src: a.src.slice(0, 90), t: Math.round(a.currentTime), paused: a.paused, err: a.error && a.error.code })), iframes: Array.from(document.querySelectorAll('iframe')).map((f) => f.src.slice(0, 60)), vis: document.visibilityState }))
            for (let i = 0; i < 4; i++) { await p.waitForTimeout(3000); console.log('visible', JSON.stringify(await st())) }
            const other = await ctx.newPage(); await other.goto('about:blank'); await other.bringToFront()
            for (let i = 0; i < 6; i++) { await p.waitForTimeout(4000); console.log('oculta', JSON.stringify(await st())) }
            await b.close()
          })()
          JS
          node t.js
