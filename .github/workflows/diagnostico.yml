name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://peliculas-neon.vercel.app
          echo "== assetlinks"; curl -s -D - "$S/.well-known/assetlinks.json" -m 30 | head -30
          echo "== google check"; curl -s "https://digitalassetlinks.googleapis.com/v1/statements:list?source.web.site=$S&relation=delegate_permission/common.handle_all_urls" -m 30 | head -c 1500
