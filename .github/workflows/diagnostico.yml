name: Diagnóstico temporal (radio archive.org)
on:
  push:
    branches: [ccr-119ea479-72dpe7]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > t.py <<'PY'
          import json, urllib.request, urllib.parse, random
          UA={'User-Agent':'Mozilla/5.0 (compatible; CarlosPNautoInteractive/1.0)'}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30))
              except Exception as e: print('ERR',e); return {}
          AD='(porn OR porno OR sex OR sexo OR xxx OR erotic OR hentai OR gore OR goregrind OR pornogrind OR "harsh noise")'
          BASE='mediatype:(audio) AND collection:(netlabels OR 78rpm OR musopen OR jamendo-albums OR freemusicarchive OR fma_full) AND NOT collection:(no-preview) AND NOT subject:'+AD+' AND NOT title:'+AD
          G={
           'rock':'subject:(rock OR "rock and roll" OR "classic rock" OR "indie rock" OR punk)',
           'pop':'subject:(pop OR "pop music" OR synthpop OR "indie pop")',
           'latina':'subject:(latin OR latina OR latino OR salsa OR cumbia OR bolero OR tango OR merengue OR bachata OR mambo OR "son cubano" OR ranchera OR "música latina" OR "musica latina")',
           'jazz':'subject:(jazz OR swing OR bebop OR "big band")',
           'blues':'subject:(blues)',
           'clasica':'subject:(classical OR "classical music" OR symphony OR baroque OR opera OR piano) OR collection:(musopen)',
           'electronica':'subject:(electronic OR electronica OR techno OR house OR trance OR idm OR edm OR "drum and bass")',
           'ambient':'subject:(ambient OR chillout OR lounge OR downtempo OR relax)',
           'hiphop':'subject:(hip-hop OR hiphop OR "hip hop" OR rap)',
           'reggae':'subject:(reggae OR dub OR ska OR dancehall)',
           'folk':'subject:(folk OR acoustic OR country OR bluegrass OR "singer-songwriter")',
           'metal':'subject:(metal OR "heavy metal" OR "death metal" OR "black metal" OR thrash)',
           'antiguos':'collection:(78rpm)',
           
          }
          for k,g in G.items():
              p=[('q',BASE+' AND ('+g+')'),('rows',50),('page',random.randint(1,5)),('output','json'),('sort[]','downloads desc')]+[('fl[]',f) for f in ['identifier','title','creator','collection']]
              d=get('https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(p)).get('response',{})
              docs=d.get('docs',[])
              print('===',k,d.get('numFound'))
              for x in random.sample(docs,min(5,len(docs))): print('   ',str(x.get('title'))[:55],'|',str(x.get('creator'))[:30],'|',[c for c in x.get('collection',[]) if not c.startswith('fav-')][:3])
              if docs:
                  x=random.choice(docs); m=get('https://archive.org/metadata/'+x['identifier'])
                  fs=[(f['name'][:40],f.get('format'),f.get('length')) for f in m.get('files',[]) if 'mp3' in (f.get('format') or '').lower()][:4]
                  print('   META',x['identifier'],m.get('metadata',{}).get('access-restricted-item'),fs)
          d=get('https://archive.org/advancedsearch.php?'+urllib.parse.urlencode([('q','mediatype:(etree) AND collection:(etree)'),('rows',5),('output','json'),('sort[]','downloads desc'),('fl[]','identifier'),('fl[]','title')])).get('response',{})
          print('=== envivo', d.get('numFound'), [x.get('title') for x in d.get('docs',[])])
          PY
          python3 t.py
