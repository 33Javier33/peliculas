name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: archive.org directo y API del sitio
        run: |
          set +e
          S=https://peliculas-neon.vercel.app
          echo "== búsqueda archive.org"; ID=$(curl -s "https://archive.org/advancedsearch.php?q=collection%3Aetree+AND+mediatype%3Aaudio&fl%5B%5D=identifier&rows=1&output=json" | python3 -c "import json,sys;print(json.load(sys.stdin)['response']['docs'][0]['identifier'])"); echo "ID=$ID"; echo "ID=$ID" >> $GITHUB_ENV
          echo "== metadata"; curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" "https://archive.org/metadata/$ID"
          F=$(curl -s "https://archive.org/metadata/$ID" | python3 -c "import json,sys;d=json.load(sys.stdin);print([f['name'] for f in d['files'] if f['name'].lower().endswith('.mp3')][0])"); echo "F=$F"; echo "F=$F" >> $GITHUB_ENV
          echo "== archivo (rango)"; curl -s -L -r 0-1000 -o /dev/null -w "%{http_code} %{time_total}s %{url_effective}\n" "https://archive.org/download/$ID/$F"
          echo "== API sitio archive-audio"; curl -s -w "\n%{http_code} %{time_total}s\n" "$S/api/archive-audio?by=all&q=grateful%20dead" | head -c 400; echo
          echo "== API audio-link"; curl -s -w "\n%{http_code} %{time_total}s\n" "$S/api/audio-link?url=https://archive.org/details/$ID" | head -c 600; echo
          echo "== API archive-best stream"; curl -s "$S/api/archive-best?json=1&stream=1&u=https://archive.org/download/$ID/$F"; echo; echo "== API archive-best"; curl -s -w "\n%{http_code} %{time_total}s\n" "$S/api/archive-best?json=1&u=https://archive.org/download/$ID/$F" | head -c 400; echo
          echo "== API archive-audio info"; curl -s -w "\n%{http_code} %{time_total}s\n" "$S/api/archive-audio?info=$ID" | head -c 400; echo
          echo "== radio archive"; curl -s -w "\n%{http_code} %{time_total}s\n" "$S/api/archive-radio?genre=rock" | head -c 400; echo
      - name: navegador real
        run: |
          npm init -y >/dev/null; npm i playwright@1.48.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright')
          ;(async () => {
            const b = await chromium.launch({ args: ['--autoplay-policy=no-user-gesture-required'] })
            const p = await b.newPage({ viewport: { width: 400, height: 860 } })
            p.on('pageerror', (e) => console.log('PAGEERROR', e.message.slice(0, 200)))
            p.on('console', (m) => m.type() === 'error' && console.log('CONSOLE', m.text().slice(0, 200)))
            p.on('requestfailed', (r) => /archive|stream|audio/.test(r.url()) && console.log('FALLO', r.url().slice(0, 140), r.failure()?.errorText))
            p.on('response', (r) => /archive\.org\/download|ia\d+\.us\.archive\.org/.test(r.url()) && console.log('RESP', r.status(), r.url().slice(0, 140)))
            await p.addInitScript(() => { sessionStorage.setItem('cpn-splash-seen', '1'); if (!localStorage.getItem('carlospn-music-store')) localStorage.setItem('carlospn-music-store', JSON.stringify({ version: 2, state: { albumsSplit: true, saved: [], savedAlbums: [], queue: [], currentIndex: 0, audioBoost: true } })) })
            await p.goto('https://peliculas-neon.vercel.app/music/archive/' + process.env.ID, { waitUntil: 'domcontentloaded' })
            await p.waitForTimeout(8000)
            console.log('PAGINA:', (await p.locator('main, body').first().innerText()).slice(0, 300).replace(/\n+/g, ' | '))
            const btn = p.locator('button:has-text("Reproducir"), button:has-text("Escuchar")').first()
            console.log('boton play:', await btn.count())
            if (await btn.count()) await btn.click()
            for (let i = 0; i < 8; i++) {
              await p.waitForTimeout(2500)
              console.log('t+' + (i + 1) * 2.5 + 's', JSON.stringify(await p.evaluate(() => Array.from(document.querySelectorAll('audio')).map((a) => ({ src: a.src.slice(0, 120), t: Math.round(a.currentTime * 10) / 10, paused: a.paused, err: a.error && a.error.code, rs: a.readyState, ns: a.networkState })))))
            }
            console.log('BARRA:', (await p.locator('[aria-label="Abrir reproductor"]').innerText().catch(() => '')).replace(/\n/g, ' | '))
            await b.close()
          })()
          JS
          sleep 120; node t.js
