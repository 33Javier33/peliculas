name: Diagnóstico temporal (cuentas)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- Script de Google (doGet)"
          curl -sL "https://script.google.com/macros/s/AKfycbyqgT_H1zaJcbMVGK_sieVFe91WsSqSDwU5VygB1SFW5DX-9AhO0DDuAWoxIfrYcGjGEw/exec" | head -c 400; echo
          echo "--- App: ¿cuentas activas?"
          curl -s https://peliculas-neon.vercel.app/api/cuenta; echo
          echo "--- App → script: cargar con un token falso (debe responder error de sesión, sin enviar correos)"
          curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"load","token":"prueba-falsa"}' https://peliculas-neon.vercel.app/api/cuenta; echo
