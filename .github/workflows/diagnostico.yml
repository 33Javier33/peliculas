name: Diagnóstico temporal (radio con artistas conocidos)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; S=https://peliculas-neon.vercel.app
          for i in $(seq 60); do curl -s "$S/" | grep -q '2\.59\.0' && break; sleep 10; done
          for g in rock rock rock latina jazz blues folk; do
            echo "=== $g"; curl -s "$S/api/archive-radio?genre=$g" | jq -r '.error // empty, (.albums[] | "   \(.artist // "?") — \(.tracks | map(.title) | join(" / "))")'
          done
