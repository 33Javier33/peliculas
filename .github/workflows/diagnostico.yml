name: Diagnóstico temporal (películas libres en vivo)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; S=https://peliculas-neon.vercel.app
          for i in $(seq 60); do curl -s "$S/" | grep -q '2\.55\.1' && break; sleep 10; done
          echo "=== commons es"; curl -s "$S/api/free-movies?source=commons&kind=es" | jq -c '.movies[] | [.title, .year, .duration, .url[0:70]]'
          echo "=== archive es"; curl -s "$S/api/free-movies?source=archive&kind=es" | jq -c '.movies[] | [.title, .year, .genre]'
          echo "=== archive classic"; curl -s "$S/api/free-movies?source=archive&kind=classic" | jq -c '.movies[0:12][] | [.title, .year, .genre]'
          for g in comedia terror scifi negro western animacion mudo documental; do echo "=== $g"; curl -s "$S/api/free-movies?source=archive&kind=classic&genre=$g" | jq -c '[(.movies|length), (.movies[0:4][]|.title)]'; done
          echo "=== search"; curl -s "$S/api/free-movies?source=archive&kind=classic&q=chaplin" | jq -c '[(.movies|length), (.movies[0:5][]|.title)]'
          curl -s "$S/api/free-movies?archive=ladrones_1930" | jq -c .
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright')
          ;(async () => {
            const b = await chromium.launch({ channel: 'chrome', args: ['--autoplay-policy=no-user-gesture-required'] })
            const p = await b.newPage({ viewport: { width: 400, height: 860 } })
            p.on('pageerror', (e) => console.log('PAGEERROR', e.message))
            await p.addInitScript(() => sessionStorage.setItem('cpn-splash-seen', '1'))
            await p.goto('https://peliculas-neon.vercel.app/peliculas')
            await p.waitForSelector('text=Cine latino e hispano restaurado', { timeout: 30000 })
            await p.waitForTimeout(3000)
            const play = async (loc, name) => {
              await loc.click()
              const ok = await p.waitForFunction(() => { const v = document.querySelector('video'); return v && v.currentTime > 2 }, null, { timeout: 45000 }).then(() => true, () => false)
              console.log(name, ok, JSON.stringify(await p.evaluate(() => { const v = document.querySelector('video'); return v && [v.currentSrc.slice(0, 110), v.currentTime, v.error && v.error.code, v.textTracks.length] })))
              await p.click('[aria-label="Cerrar película"]')
            }
            await play(p.locator('section:has-text("Cine latino") button').first(), 'commons')
            await play(p.locator('div.grid button').first(), 'archive-es')
            await p.click('button:text-is("Clásicos")')
            await p.waitForTimeout(4000)
            await play(p.locator('div.grid button').nth(2), 'archive-classic')
            await b.close()
          })()
          JS
          node t.js
