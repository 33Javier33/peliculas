name: Diagnóstico temporal (filtros películas)
on:
  push:
    branches: [ccr-119ea479-72dpe7]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > t.py <<'PY'
          import json, urllib.request, urllib.parse
          UA={'User-Agent':'Mozilla/5.0 (compatible; CarlosPNautoInteractive/1.0)'}
          def get(u):
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30))
              except Exception as e: print('ERR',e); return {}
          FILM='collection:(feature_films OR Film_Noir OR SciFi_Horror OR Comedy_Films OR silent_films OR classic_cartoons OR animationandcartoons OR cinemocracy)'
          ADULT='(erotic OR erotica OR erótica OR erotico OR erótico OR sex OR sexo OR sexy OR xxx OR porn OR porno OR adult OR adultos OR nudist OR nudism OR nudista OR hentai OR stag OR sexploitation OR softcore OR desnudo OR desnudos OR desnuda OR desnudas)'
          EX='NOT subject:%s AND NOT title:%s AND NOT title:(dvdrip OR brrip OR bdrip OR webrip OR hdrip OR camrip OR "web-dl" OR trailer OR tráiler OR avance) AND NOT collection:(movie_trailers OR no-preview)'%(ADULT,ADULT)
          SP='language:(spa OR Spanish OR español OR Español OR espanol OR "Spanish; Castilian")'
          CUR='collection:(SciFi_Horror OR Film_Noir OR Comedy_Films OR silent_films OR classic_cartoons OR cinemocracy)'
          def q(name,s,rows=40,sort='downloads desc'):
              p=[('q',s),('rows',rows),('output','json'),('sort[]',sort)]+[('fl[]',f) for f in ['identifier','title','year','collection']]
              d=get('https://archive.org/advancedsearch.php?'+urllib.parse.urlencode(p)).get('response',{})
              print('===',name,d.get('numFound'))
              for x in d.get('docs',[]): print('   ',x.get('year'),'|',str(x.get('title'))[:70],'|',x.get('identifier')[:50],'|',[c for c in x.get('collection',[]) if not c.startswith('fav-')][:3])
          base=FILM+' AND mediatype:(movies) AND '+EX
          q('ES curated', base+' AND '+SP+' AND ((year:[1890 TO 1977] AND '+CUR+') OR year:[1890 TO 1930] OR licenseurl:(*creativecommons*))',60)
          q('ES cc only', base+' AND '+SP+' AND licenseurl:(*creativecommons*)',10)
          q('CLASSIC', base+' AND (year:[1890 TO 1970] OR licenseurl:(*creativecommons*))',30)
          q('CLASSIC cc', base+' AND licenseurl:(*creativecommons*)',10)
          q('CLASSIC terror', base+' AND (year:[1890 TO 1970] OR licenseurl:(*creativecommons*)) AND (subject:(horror OR terror OR zombie OR vampire OR monster))',8)
          q('CLASSIC animacion', base+' AND (year:[1890 TO 1970] OR licenseurl:(*creativecommons*)) AND (collection:(classic_cartoons OR animationandcartoons) OR subject:(animation OR animated OR cartoon OR cartoons OR animación))',8)
          q('CLASSIC mudo', base+' AND (year:[1890 TO 1970] OR licenseurl:(*creativecommons*)) AND (collection:(silent_films) OR subject:(silent OR "silent film" OR "cine mudo"))',8)
          q('CLASSIC chaplin', base+' AND (year:[1890 TO 1970] OR licenseurl:(*creativecommons*)) AND (title:(chaplin) OR creator:(chaplin) OR subject:(chaplin))',8)
          for i in ['dra-cula.-esp.-mp-4.','frankenstein-1931-doblada-al-espanol','ElHotelDelTerror1960Espanol']:
              m=get('https://archive.org/metadata/'+i)
              print('META',i,[ (f['name'],f.get('format')) for f in m.get('files',[]) if f['name'].lower().endswith(('.mp4','.srt','.vtt','.webm','.ogv'))][:8])
          PY
          python3 t.py
