name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://peliculas-neon.vercel.app
          for id in 2F7bK2uAvPA dQw4w9WgXcQ; do
            echo "== stream $id"; curl -s -o /tmp/a -D - -H 'Range: bytes=0-6291455' "$S/api/stream?id=$id" -m 70 | head -12; ls -la /tmp/a; head -c 300 /tmp/a | strings | head -5
            echo "== audio $id"; curl -s "$S/api/audio?id=$id" -m 30 | head -c 1500; echo
          done
          echo "== estado"; curl -s "$S/api/estado" -m 30 | head -c 2000
