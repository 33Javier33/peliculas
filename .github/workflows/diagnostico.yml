name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          S=https://peliculas-neon.vercel.app
          echo "== track-info"; curl -s "$S/api/catalog/track-info?artist=The%20Doors&title=Strange%20Days" -m 40 | head -c 800; echo
          echo "== music-info"; curl -s "$S/api/music-info?artist=The%20Doors&album=Strange%20Days" -m 40 | head -c 600; echo
          echo "== music-info2"; curl -s "$S/api/music-info?artist=The%20Doors" -m 40 | head -c 300; echo
