name: diagnostico
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          S=https://peliculas-neon.vercel.app
          for i in $(seq 1 40); do curl -s $S/ | grep -q '2\.63\.0' && break; sleep 15; done
          for c in CL MX AR PE CO US; do
            echo "== $c"; curl -s "$S/api/free-services?region=$c" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('error',''),[(r['name'],r['providerId'],len(r['movies']),[m['title'] for m in r['movies'][:4]]) for r in d['rows']])"
          done
