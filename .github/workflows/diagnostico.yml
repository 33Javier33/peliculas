name: diagnostico
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1); AA=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          for f in CarlosPNauto.apk CarlosPNauto-Reloj.apk; do
            echo "===== $f"
            curl -sL -o $f https://github.com/33Javier33/peliculas/releases/download/android-latest/$f
            curl -sL -o via-app-$f "https://peliculas-neon.vercel.app/api/apk$([ $f = CarlosPNauto-Reloj.apk ] && echo '?f=reloj')"
            ls -l $f via-app-$f; sha256sum $f via-app-$f | cut -c1-20
            unzip -tq $f | tail -1
            $AS verify --verbose --print-certs $f 2>&1 | grep -E "Verified using|Signer #1 certificate SHA-256|DOES NOT|ERROR|WARNING: .*not protected" | head -8
            $AA dump badging $f | grep -E "^package|sdkVersion|targetSdk|uses-feature|application-debuggable|testOnly|native-code" | head -8
          done
          echo "===== permisos y servicios nuevos (teléfono)"
          $AA dump permissions CarlosPNauto.apk | head -30
