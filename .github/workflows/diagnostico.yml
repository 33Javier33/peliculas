name: Diagnóstico temporal (películas libres en vivo)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; S=https://peliculas-neon.vercel.app
          for i in $(seq 60); do curl -s "$S/api/free-movies?archive=night_of_the_living_dead" | grep -q subtitles && break; sleep 10; done; curl -s "$S/api/estado" | head -c 200; echo
          echo "=== commons es"; curl -s "$S/api/free-movies?source=commons&kind=es" | jq -c '.movies[] | [.title, .year, .duration, .fallbackUrl[0:60]]' | head -40
          echo "=== commons classic"; curl -s "$S/api/free-movies?source=commons&kind=classic" | jq -c '.movies[] | [.title, .year, .duration]' | head -15
          echo "=== archive es"; curl -s "$S/api/free-movies?source=archive&kind=es" | jq -c '.movies[] | [.id, .title, .year, .genre]' | head -48
          echo "=== archive es p2"; curl -s "$S/api/free-movies?source=archive&kind=es&page=2" | jq -c '.movies[] | [.title, .year]' | head -48
          echo "=== archive classic"; curl -s "$S/api/free-movies?source=archive&kind=classic" | jq -c '.movies[] | [.title, .year, .genre]' | head -20
          for g in comedia terror scifi negro western animacion mudo documental; do echo "=== $g"; curl -s "$S/api/free-movies?source=archive&kind=classic&genre=$g" | jq -c "[.movies|length, (.movies[0:4][]|.title)]" || true; done
          echo "=== es terror"; curl -s "$S/api/free-movies?source=archive&kind=es&genre=terror" | jq -c '[.movies|length, (.movies[0:6][]|.title)]'
          echo "=== search"; curl -s "$S/api/free-movies?source=archive&kind=classic&q=chaplin" | jq -c '[.movies|length, (.movies[0:5][]|.title)]'
          echo "=== video"; curl -s "$S/api/free-movies?archive=night_of_the_living_dead" | jq -c .
          curl -s "$S/api/free-movies?archive=HorrorExpresswithSpanishSubtitles" | jq -c .
          echo "=== transcode"; T=$(curl -s "$S/api/free-movies?source=commons&kind=es" | jq -r '.movies[0].fallbackUrl'); echo $T; curl -sI -A Mozilla/5.0 "$T" | head -5
          U=$(curl -s "$S/api/free-movies?source=commons&kind=es" | jq -r '.movies[0].url'); curl -sI -A Mozilla/5.0 "$U" | grep -iE "^HTTP|content-length|access-control"
          for v in 480p.mp4 360p.mp4 480p.webm; do curl -s -o /dev/null -w "$v %{http_code}\n" -A Mozilla/5.0 -I "${U/\/commons\//\/commons\/transcoded\/}/$(basename "$U").$v"; done
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright')
          ;(async () => {
            const b = await chromium.launch({ args: ['--autoplay-policy=no-user-gesture-required'] })
            const p = await b.newPage({ viewport: { width: 400, height: 860 } })
            p.on('pageerror', (e) => console.log('PAGEERROR', e.message))
            await p.addInitScript(() => sessionStorage.setItem('cpn-splash-seen', '1'))
            await p.goto('https://peliculas-neon.vercel.app/peliculas')
            await p.waitForSelector('text=Cine latino e hispano restaurado', { timeout: 30000 })
            await p.waitForTimeout(3000)
            await p.screenshot({ path: 's1.png' })
            const tiles = p.locator('section:has-text("Cine latino") button')
            console.log('commons tiles', await tiles.count())
            await tiles.first().click()
            const ok = await p.waitForFunction(() => { const v = document.querySelector('video'); return v && v.currentTime > 2 }, null, { timeout: 40000 }).then(() => true, () => false)
            console.log('commons playing', ok, await p.evaluate(() => { const v = document.querySelector('video'); return v && [v.currentSrc.slice(0, 120), v.currentTime, v.error && v.error.code] }))
            await p.click('[aria-label="Cerrar película"]')
            const grid = p.locator('div.grid button')
            console.log('archive tiles', await grid.count())
            await grid.first().click()
            const ok2 = await p.waitForFunction(() => { const v = document.querySelector('video'); return v && v.currentTime > 2 }, null, { timeout: 40000 }).then(() => true, () => false)
            console.log('archive playing', ok2, await p.evaluate(() => { const v = document.querySelector('video'); return v && [v.currentSrc.slice(0, 120), v.currentTime, v.error && v.error.code, v.textTracks.length] }))
            console.log(await p.locator('[role=dialog]').innerText())
            await b.close()
          })()
          JS
          node t.js
