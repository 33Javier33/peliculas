name: Diagnóstico temporal (archive.org)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar la app con un navegador
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright')
          ;(async () => {
            const b = await chromium.launch({ args: ['--autoplay-policy=no-user-gesture-required'] })
            const p = await b.newPage({ viewport: { width: 400, height: 860 } })
            p.on('console', (m) => console.log('CONSOLE', m.type(), m.text().slice(0, 200)))
            p.on('pageerror', (e) => console.log('PAGEERROR', e.message))
            p.on('requestfailed', (r) => console.log('FAILED', r.url().slice(0, 150), r.failure()?.errorText))
            p.on('response', (r) => { const u = r.url(); if (/archive\.org\/(download|0\/items)|link-audio|api\/hls|audio-link/.test(u)) console.log('RESP', r.status(), u.slice(0, 160)) })
            await p.addInitScript(() => sessionStorage.setItem('cpn-splash-seen', '1'))
            await p.goto('https://peliculas-neon.vercel.app/music/archive/black-album', { waitUntil: 'networkidle' })
            await p.waitForTimeout(3000)
            console.log('PAGE', (await p.locator('main').innerText()).slice(0, 400).replace(/\n/g, ' | '))
            await p.click('button:has-text("Reproducir")')
            for (let i = 0; i < 6; i++) {
              await p.waitForTimeout(4000)
              console.log('AUDIO', JSON.stringify(await p.evaluate(() => [...document.querySelectorAll('audio')].map((a) => ({ src: a.currentSrc.slice(0, 120), t: a.currentTime, paused: a.paused, err: a.error && a.error.code, cors: a.crossOrigin, rs: a.readyState, ns: a.networkState })))))
              console.log('NOW', await p.evaluate(() => { try { const s = JSON.parse(localStorage.getItem('carlospn-music-store')); return s.state.currentIndex } catch { return '?' } }))
            }
            await b.close()
          })()
          JS
          node t.js
