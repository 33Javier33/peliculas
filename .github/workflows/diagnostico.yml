name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== releases"; curl -s "https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases?per_page=4" | python3 -c "import json,sys; [print(r['tag_name'], r['published_at'][:10]) for r in json.load(sys.stdin)]"
          echo "== usada"; curl -s "https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/commits/6faf40681e" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['sha'][:12], d['commit']['committer']['date'], d['commit']['message'][:90])"
          echo "== dev"; curl -s "https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/commits?per_page=5&sha=dev" | python3 -c "import json,sys; [print(c['sha'][:10], c['commit']['committer']['date'][:10], c['commit']['message'][:70].replace(chr(10),' ')) for c in json.load(sys.stdin)]"
          echo "== jitpack dev"; curl -s -o /dev/null -w "%{http_code}\n" "https://jitpack.io/api/builds/com.github.TeamNewPipe/NewPipeExtractor/latest"
          curl -s "https://jitpack.io/api/builds/com.github.TeamNewPipe/NewPipeExtractor/latest" | head -c 300; echo
