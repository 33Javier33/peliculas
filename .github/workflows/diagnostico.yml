name: diagnostico
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== live"; curl -s https://www.nts.live/api/v2/live | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          for c in d.get('results',[]):
            n=c.get('now',{}); e=(n.get('embeds') or {}).get('details') or {}
            print(c.get('channel_name'), '|', n.get('broadcast_title'), '|', n.get('start_timestamp'), n.get('end_timestamp'), '|', (e.get('media') or {}).get('picture_medium','')[:80], '|', [g.get('value') for g in e.get('genres',[])][:4], '| next:', (c.get('next') or {}).get('broadcast_title'))
          print('keys', list(d.get('results',[{}])[0].keys()) if d.get('results') else d)"
          echo "== mixtapes"; curl -s https://www.nts.live/api/v2/mixtapes | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          for m in d.get('results',[])[:20]: print(m.get('mixtape_alias'), '|', m.get('title'), '|', m.get('subtitle'), '|', m.get('audio_stream_endpoint'), '|', (m.get('media') or {}).get('picture_medium','')[:70])
          print(len(d.get('results',[])))"
          for u in https://stream-relay-geo.ntslive.net/stream https://stream-relay-geo.ntslive.net/stream2; do echo "== $u"; curl -s -m 8 -o /tmp/s -D - "$u" | head -12; ls -l /tmp/s; done
          M=$(curl -s https://www.nts.live/api/v2/mixtapes | python3 -c "import sys,json;print(json.load(sys.stdin)['results'][0]['audio_stream_endpoint'])"); echo "== mixtape $M"; curl -s -m 8 -o /tmp/m -D - "$M" | head -10; ls -l /tmp/m
          echo "== robots"; curl -s https://www.nts.live/robots.txt | head -20
