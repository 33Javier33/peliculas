name: App Android (APK)

# Arma el APK en cada cambio de la carpeta android/ y lo publica en la versión
# "android-latest" de GitHub (enlace fijo para descargarlo desde el teléfono).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Carpeta fija para la firma (la de por defecto cambia en las máquinas de GitHub y no se guardaba)
      ANDROID_USER_HOME: /home/runner/.cpn-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # (El SDK de Android ya viene instalado en las máquinas de GitHub)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # La firma se guarda en la caché privada de GitHub (no en el repositorio): así cada APK
      # nuevo actualiza al anterior. Opcional: una firma propia en los secretos ANDROID_KEYSTORE_*.
      - name: Firma guardada entre compilaciones
        uses: actions/cache@v4
        with:
          path: /home/runner/.cpn-android/debug.keystore
          key: cpn-android-signing-v2

      - name: Firma propia (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Armar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p "$ANDROID_USER_HOME"
          gradle -p android assembleRelease 2>&1 | tee build.log
          # Sin la firma guardada, el próximo APK no podría instalarse encima de este
          test -f "$ANDROID_USER_HOME/debug.keystore" || { echo "No se generó la firma en $ANDROID_USER_HOME"; exit 1; }

      - name: Errores de compilación (si falló)
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)" -A4 build.log | head -80 || true

      - name: Nombre del archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk CarlosPNauto.apk

      - name: Publicar en "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: App Android (última versión)
          body: |
            Descarga **CarlosPNauto.apk** e instálalo (Android te pedirá permitir "instalar apps desconocidas").
            Compilación ${{ github.run_number }} · ${{ github.sha }}
          files: CarlosPNauto.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: CarlosPNauto-${{ github.run_number }}
          path: CarlosPNauto.apk
