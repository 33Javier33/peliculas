name: App Android (APK)

# Arma el APK en cada cambio de la carpeta android/ y lo publica en la versión
# "android-latest" de GitHub (enlace fijo para descargarlo desde el teléfono).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Carpeta fija para la firma (la de por defecto cambia en las máquinas de GitHub y no se guardaba)
      ANDROID_USER_HOME: /home/runner/.cpn-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # (El SDK de Android ya viene instalado en las máquinas de GitHub)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # La firma se guarda en la caché privada de GitHub (no en el repositorio): así cada APK
      # nuevo actualiza al anterior. Opcional: una firma propia en los secretos ANDROID_KEYSTORE_*.
      - name: Firma guardada entre compilaciones
        uses: actions/cache@v4
        with:
          path: /home/runner/.cpn-android/debug.keystore
          key: cpn-android-signing-v2

      - name: Firma propia (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Armar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p "$ANDROID_USER_HOME"
          gradle -p android assembleRelease 2>&1 | tee build.log
          # Sin la firma guardada, el próximo APK no podría instalarse encima de este
          test -f "$ANDROID_USER_HOME/debug.keystore" || { echo "No se generó la firma en $ANDROID_USER_HOME"; exit 1; }

      - name: Errores de compilación (si falló)
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)" -A4 build.log | head -80 || true

      - name: Nombre del archivo
        run: |
          # PulsoMedia (completa) y su reloj
          cp android/app/build/outputs/apk/media/release/app-media-release.apk CarlosPNauto.apk
          cp android/wear/build/outputs/apk/media/release/wear-media-release.apk CarlosPNauto-Reloj.apk
          # PulsoMusic (solo música, radios y videos musicales) y su reloj
          cp android/app/build/outputs/apk/music/release/app-music-release.apk PulsoMusic.apk
          cp android/wear/build/outputs/apk/music/release/wear-music-release.apk PulsoMusic-Reloj.apk

      # Enlaces compartidos (WhatsApp…) que abren la app: Android comprueba que la web y la app son
      # del mismo dueño con la huella de la firma (assetlinks.json; la web lo sirve desde el release)
      - name: Huella de la firma para los enlaces
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs CarlosPNauto.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //' | tr -d ' \n' | sed 's/../&:/g; s/:$//' | tr 'a-f' 'A-F')
          test -n "$SHA" || { echo "No se pudo leer la huella"; exit 1; }
          echo "Huella SHA-256: $SHA"
          cat > assetlinks.json <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"cl.carlospnauto.app","sha256_cert_fingerprints":["$SHA"]}},{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"cl.carlospnauto.music","sha256_cert_fingerprints":["$SHA"]}}]
          JSON
          cat assetlinks.json

      # Versión publicada y qué trae: la página avisa a quien tenga una versión anterior
      - name: Datos de la versión
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          notes = (os.environ.get('NOTES') or '').split('\n')[0].replace('APK: ', '').strip()
          json.dump({
            'version': '1.0.' + os.environ['GITHUB_RUN_NUMBER'],
            'build': int(os.environ['GITHUB_RUN_NUMBER']),
            'notes': notes,
            'date': datetime.datetime.utcnow().strftime('%Y-%m-%d'),
          }, open('version.json', 'w'), ensure_ascii=False)
          # PulsoMusic: su propia numeración (empezó en 1.0.1)
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          json.dump({
            'version': '1.0.' + str(max(1, n - 53)),
            'build': n,
            'notes': notes,
            'date': datetime.datetime.utcnow().strftime('%Y-%m-%d'),
          }, open('version-music.json', 'w'), ensure_ascii=False)
          PY
          cat version.json version-music.json

      - name: Publicar en "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: App Android (última versión)
          body: |
            Descarga **CarlosPNauto.apk** e instálalo (Android te pedirá permitir "instalar apps desconocidas").
            Reloj (Wear OS): **CarlosPNauto-Reloj.apk** (pasos en la página /app-reloj de la app).
            PulsoMusic (solo música, radios y videos musicales): **PulsoMusic.apk** y su reloj **PulsoMusic-Reloj.apk**.
            Compilación ${{ github.run_number }} · ${{ github.sha }}
          files: |
            CarlosPNauto.apk
            CarlosPNauto-Reloj.apk
            PulsoMusic.apk
            PulsoMusic-Reloj.apk
            version.json
            version-music.json
            assetlinks.json
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: CarlosPNauto-${{ github.run_number }}
          path: |
            CarlosPNauto.apk
            CarlosPNauto-Reloj.apk
            PulsoMusic.apk
            PulsoMusic-Reloj.apk
