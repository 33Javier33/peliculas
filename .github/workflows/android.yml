name: App Android (APK)

# Arma el APK en cada cambio de la carpeta android/ y lo publica en la versión
# "android-latest" de GitHub (enlace fijo para descargarlo desde el teléfono).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Carpeta fija para la firma (la de por defecto cambia en las máquinas de GitHub y no se guardaba)
      ANDROID_USER_HOME: /home/runner/.cpn-android
    steps:
      - uses: actions/checkout@v5
        with:
          # Historia completa: para saber si cambió la app o solo las esferas
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # (El SDK de Android ya viene instalado en las máquinas de GitHub)

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # La firma se guarda en la caché privada de GitHub (no en el repositorio): así cada APK
      # nuevo actualiza al anterior. Opcional: una firma propia en los secretos ANDROID_KEYSTORE_*.
      - name: Firma guardada entre compilaciones
        uses: actions/cache@v4
        with:
          path: /home/runner/.cpn-android/debug.keystore
          key: cpn-android-signing-v2

      - name: Firma propia (si está configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Armar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Receptor propio de Chromecast (opcional): Settings → Secrets and variables → Variables
          CAST_APP_ID_MEDIA: ${{ vars.CAST_APP_ID_MEDIA }}
          CAST_APP_ID_MUSIC: ${{ vars.CAST_APP_ID_MUSIC }}
        run: |
          set -o pipefail
          mkdir -p "$ANDROID_USER_HOME"
          gradle -p android assembleRelease 2>&1 | tee build.log
          # Sin la firma guardada, el próximo APK no podría instalarse encima de este
          test -f "$ANDROID_USER_HOME/debug.keystore" || { echo "No se generó la firma en $ANDROID_USER_HOME"; exit 1; }

      - name: Errores de compilación (si falló)
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not (find|resolve)" -A4 build.log | head -80 || true

      - name: Nombre del archivo
        run: |
          # PulsoMedia (completa) y su reloj
          cp android/app/build/outputs/apk/media/release/app-media-release.apk CarlosPNauto.apk
          cp android/wear/build/outputs/apk/media/release/wear-media-release.apk CarlosPNauto-Reloj.apk
          # PulsoMusic (solo música, radios y videos musicales) y su reloj
          cp android/app/build/outputs/apk/music/release/app-music-release.apk PulsoMusic.apk
          cp android/wear/build/outputs/apk/music/release/wear-music-release.apk PulsoMusic-Reloj.apk
          # Esferas de reloj: una por carpeta (explorer → Esfera-Explorer.apk)
          for d in android/esferas-de-reloj/*/; do
            n=$(basename "$d")
            cp "$d"build/outputs/apk/release/*-release.apk "Esfera-${n^}.apk"
          done
          ls -la Esfera-*.apk

      # Lista de esferas para la app del reloj (marca las instaladas y las que hay que actualizar).
      # La versión de cada una es la misma que calcula su build.gradle.kts (1000 + sus cambios)
      - name: Lista de esferas
        run: |
          python3 - <<'PY'
          import json, subprocess, re, glob, os
          out = []
          for d in sorted(glob.glob('android/esferas-de-reloj/*/')):
              n = os.path.basename(d.rstrip('/'))
              cnt = int(subprocess.check_output(['git', 'rev-list', '--count', 'HEAD', '--', os.path.abspath(d), os.path.abspath('android/esferas-comun')]).strip() or 0)
              g = open(d + 'build.gradle.kts').read()
              pkg = re.search(r'applicationId = "([^"]+)"', g).group(1)
              st = open(d + 'src/main/res/values/strings.xml', encoding='utf-8').read()
              name = re.search(r'name="face_name">([^<]+)<', st).group(1)
              f = 'Esfera-' + n[0].upper() + n[1:] + '.apk'
              out.append({'file': f, 'name': name, 'package': pkg, 'version': 1000 + cnt, 'size': os.path.getsize(f)})
          json.dump(out, open('esferas.json', 'w'), ensure_ascii=False)
          PY
          cat esferas.json

      # Enlaces compartidos (WhatsApp…) que abren la app: Android comprueba que la web y la app son
      # del mismo dueño con la huella de la firma (assetlinks.json; la web lo sirve desde el release)
      - name: Huella de la firma para los enlaces
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs CarlosPNauto.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //' | tr -d ' \n' | sed 's/../&:/g; s/:$//' | tr 'a-f' 'A-F')
          test -n "$SHA" || { echo "No se pudo leer la huella"; exit 1; }
          echo "Huella SHA-256: $SHA"
          cat > assetlinks.json <<JSON
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"cl.carlospnauto.app","sha256_cert_fingerprints":["$SHA"]}},{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"cl.carlospnauto.music","sha256_cert_fingerprints":["$SHA"]}}]
          JSON
          cat assetlinks.json

      # ¿Cambió la app del teléfono? ¿Y la del reloj? Cada una se publica (y pide actualizar) solo si
      # cambió ella: agregar esferas o cambiar el teléfono ya no hace actualizar el reloj, y al revés
      - name: ¿Qué cambió?
        run: |
          COMMON="android/build.gradle.kts android/gradle.properties android/gradle"
          APP_COMMIT=$(git log -1 --format=%H -- android/app $COMMON)
          WEAR_COMMIT=$(git log -1 --format=%H -- android/wear $COMMON)
          PREV_APP=$(curl -sfL "https://github.com/${{ github.repository }}/releases/download/android-latest/app-commit.txt" || true)
          PREV_WEAR=$(curl -sfL "https://github.com/${{ github.repository }}/releases/download/android-latest/wear-commit.txt" || true)
          echo "$APP_COMMIT" > app-commit.txt
          echo "$WEAR_COMMIT" > wear-commit.txt
          FORCE=false; [ "${{ github.event_name }}" = "workflow_dispatch" ] && FORCE=true
          if [ "$APP_COMMIT" = "$PREV_APP" ] && [ "$FORCE" != true ]; then echo "APP_CHANGED=false" >> "$GITHUB_ENV"; else echo "APP_CHANGED=true" >> "$GITHUB_ENV"; fi
          if [ "$WEAR_COMMIT" = "$PREV_WEAR" ] && [ "$FORCE" != true ]; then echo "WEAR_CHANGED=false" >> "$GITHUB_ENV"; else echo "WEAR_CHANGED=true" >> "$GITHUB_ENV"; fi
          echo "Teléfono: $PREV_APP → $APP_COMMIT · Reloj: $PREV_WEAR → $WEAR_COMMIT"
          echo "PREV_APP=$PREV_APP" >> "$GITHUB_ENV"
          echo "APP_COMMIT=$APP_COMMIT" >> "$GITHUB_ENV"

      # Versión publicada y qué trae: la página avisa a quien tenga una versión anterior
      - name: Datos de la versión
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          # Lo que trae: los cambios de la app del teléfono desde la versión anterior (sin las mezclas
          # de ramas), y el historial de las últimas versiones (el aviso de actualizar muestra todo lo
          # nuevo desde la versión que tiene instalada cada persona)
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/android-latest/version.json" -o prev-version.json || echo '{}' > prev-version.json
          python3 - <<'PY'
          import json, os, datetime, subprocess
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          prev, cur = os.environ.get('PREV_APP', ''), os.environ.get('APP_COMMIT', '')
          paths = ['android/app', 'android/build.gradle.kts', 'android/gradle.properties']
          def log(rng):
            out = subprocess.run(['git', 'log', '--no-merges', '--format=%s', rng, '--'] + paths, capture_output=True, text=True)
            return out.stdout if out.returncode == 0 else ''
          text = log(f'{prev}..{cur}') if prev and cur and prev != cur else ''
          if not text.strip():
            text = log('-3')
          changes, seen = [], set()
          for line in text.splitlines():
            line = line.replace('APK: ', '').strip()
            if not line or line.lower().startswith(('merge', 'wip', 'fixup')) or line in seen:
              continue
            seen.add(line)
            changes.append(line)
          changes = changes[:12]
          notes = changes[0] if changes else (os.environ.get('NOTES') or '').split('\n')[0].strip()
          date = datetime.datetime.utcnow().strftime('%Y-%m-%d')
          try:
            history = json.load(open('prev-version.json')).get('history') or []
          except Exception:
            history = []
          history = [h for h in history if h.get('build') != n]
          if os.environ.get('APP_CHANGED') == 'true':
            history = [{'build': n, 'date': date, 'changes': changes}] + history
          history = history[:30]
          base = {'build': n, 'notes': notes, 'changes': changes, 'date': date, 'history': history}
          json.dump({'version': '1.0.' + str(n), **base}, open('version.json', 'w'), ensure_ascii=False)
          # PulsoMusic: su propia numeración (empezó en 1.0.1)
          json.dump({'version': '1.0.' + str(max(1, n - 53)), **base}, open('version-music.json', 'w'), ensure_ascii=False)
          PY
          # App del reloj: su propia versión (2.N, N = cambios del reloj), igual que en wear/build.gradle.kts
          python3 - <<'PY'
          import json, os, subprocess, datetime
          n = int(subprocess.check_output(['git', 'rev-list', '--count', 'HEAD', '--', os.path.abspath('android/wear')]).strip() or 0)
          notes = subprocess.check_output(['git', 'log', '-1', '--format=%s', '--', 'android/wear']).decode().strip()
          json.dump({'version': '2.' + str(n), 'build': 1000 + n, 'notes': notes,
                     'date': datetime.datetime.utcnow().strftime('%Y-%m-%d')}, open('version-reloj.json', 'w'), ensure_ascii=False)
          PY
          cat version.json version-music.json version-reloj.json

      - name: Publicar la app del teléfono
        if: env.APP_CHANGED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: App Android (última versión)
          body: |
            Descarga **CarlosPNauto.apk** e instálalo (Android te pedirá permitir "instalar apps desconocidas").
            Reloj (Wear OS): **CarlosPNauto-Reloj.apk** (pasos en la página /app-reloj de la app).
            PulsoMusic (solo música, radios y videos musicales): **PulsoMusic.apk** y su reloj **PulsoMusic-Reloj.apk**.
            Esferas de reloj: **Esfera-*.apk** (tienda en la página /esferas de la app).
            Compilación ${{ github.run_number }} · ${{ github.sha }}
          files: |
            CarlosPNauto.apk
            PulsoMusic.apk
            version.json
            version-music.json
            assetlinks.json
            app-commit.txt
          make_latest: true

      # La app del reloj: solo si cambió (si no, el reloj no pide actualizar)
      - name: Publicar la app del reloj
        if: env.WEAR_CHANGED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          files: |
            CarlosPNauto-Reloj.apk
            PulsoMusic-Reloj.apk
            version-reloj.json
            wear-commit.txt
          make_latest: true

      # Esferas: siempre (cada una tiene su versión según sus cambios; el reloj solo marca las que cambiaron)
      - name: Publicar las esferas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          files: |
            Esfera-*.apk
            esferas.json
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: CarlosPNauto-${{ github.run_number }}
          path: |
            CarlosPNauto.apk
            CarlosPNauto-Reloj.apk
            PulsoMusic.apk
            PulsoMusic-Reloj.apk
            Esfera-*.apk
